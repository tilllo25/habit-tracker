<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Tracker</title>
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <main>
    <header class="top-bar">
      <h1>Habit Tracker</h1>
      <div class="theme-picker">
        <label for="theme-select">Mode</label>
        <select id="theme-select">
          <option value="light">☀️ Light</option>
          <option value="dark">🌙 Dark</option>
          <option value="party">🎉 Party</option>
        </select>
      </div>
    </header>


    <form id="add-habit-form" class="add-habit" novalidate>
      <div class="field">
        <label for="habit-name">New habit</label>
        <input
          id="habit-name"
          name="habit-name"
          type="text"
          placeholder="e.g. Drink 2L of water"
          maxlength="60"
          autocomplete="off"
          required
        >
      </div>
      <div class="field">
        <label for="habit-description">Description <span class="optional">(optional)</span></label>
        <input
          id="habit-description"
          name="habit-description"
          type="text"
          placeholder="e.g. Keep a bottle on my desk"
          maxlength="140"
          autocomplete="off"
        >
      </div>
      <button type="submit">Add habit</button>
      <p id="form-error" class="form-error" role="alert"></p>
    </form>

    <section aria-labelledby="habits-heading">
      <h2 id="habits-heading">Your habits</h2>
      <div id="today-summary" class="today-summary" hidden>
        <p class="today-summary__text" aria-live="polite">
          <span id="today-count" class="today-summary__count"></span>
          <span id="today-label" class="today-summary__label"></span>
        </p>
        <div
          id="today-progress"
          class="today-summary__bar"
          role="progressbar"
          aria-label="Habits done today"
          aria-valuemin="0"
        >
          <div id="today-progress-fill" class="today-summary__fill"></div>
        </div>
      </div>
      <p id="empty-state" class="empty-state">No habits yet. Add your first one above.</p>
      <ul id="habit-list" class="habit-list"></ul>
    </section>
  </main>
  <script src="app.js?v=4"></script>
</body>
</html>
